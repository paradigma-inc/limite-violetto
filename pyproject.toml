[project]
name = "limite-vllm"
version = "0.1.0"
description = "Optimized out-of-tree vLLM implementation of Limite"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["transformers>=5.6.2,<=5.14.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.12.1,<=0.16.1",
    "torch==2.13.0",
]

[project.entry-points."vllm.general_plugins"]
limite = "limite_vllm.register:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limite_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
