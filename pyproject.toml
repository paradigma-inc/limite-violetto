[project]
name = "limite-vllm"
version = "0.2.0"
description = "Optimized out-of-tree vLLM implementation of Limite"
readme = "README.md"
license = "Apache-2.0"
requires-python = "~=3.12.0"
dependencies = [
    "torch>=2.13.0",
    "transformers>=5.6.2",
    # The attention backend and the seeded-sampler patches subclass vLLM 0.28.0
    # internals and check their source digests at startup.
    "vllm==0.28.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.12.1,<=0.16.1",
]

[project.entry-points."vllm.general_plugins"]
limite = "limite_vllm.register:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limite_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv]
package = true
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
# The CUDA 12.9 build every published speed and parity number was measured on.
vllm = [
    { url = "https://github.com/vllm-project/vllm/releases/download/v0.28.0/vllm-0.28.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
